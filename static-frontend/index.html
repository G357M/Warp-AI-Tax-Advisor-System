<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoHub AI Tax Advisor - საგადასახადო AI ასისტენტი</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .status {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .api-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .api-link:hover {
            transform: translateY(-2px);
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ InfoHub AI Tax Advisor</h1>
        <p>საგადასახადო კანონმდებლობის ხელოვნური ინტელექტის ასისტენტი</p>
        
        <div class="status">
            <strong>✅ სისტემა მუშაობს!</strong><br>
            Backend API დაკავშირებულია და მზადაა მუშაობისთვის.
        </div>
        
        <p>
            React ინტერფეისი ამჟამად მუშავდება. დროებით შეგიძლიათ გამოიყენოთ API endpoint-ები პირდაპირ.
        </p>
        
        <a href="/docs" class="api-link">📚 API დოკუმენტაცია</a>
    </div>
</body>
</html>
