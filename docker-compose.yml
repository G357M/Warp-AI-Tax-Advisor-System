x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: infohub-postgres
    environment:
      POSTGRES_USER: infohub_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: infohub_ai
    volumes:
      - infohub_postgres_data:/var/lib/postgresql/data
    # No public port: Postgres is reachable only on the internal docker network
    # (backend connects via postgres:5432). Never expose the DB to the internet.
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infohub_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infohub-redis
    volumes:
      - infohub_redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: infohub-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infohub-backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://infohub_user:${POSTGRES_PASSWORD}@postgres:5432/infohub_ai
      - INFOHUB_V2_BACKEND_MODE=${INFOHUB_V2_BACKEND_MODE:-db}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_PREVIOUS_SECRET_KEYS=${JWT_PREVIOUS_SECRET_KEYS:-}
      - JWT_PREVIOUS_SECRET_ACCEPT_UNTIL=${JWT_PREVIOUS_SECRET_ACCEPT_UNTIL:-}
      - RATE_LIMIT_BYPASS_TOKEN=${RATE_LIMIT_BYPASS_TOKEN}
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH:-10/minute}
      - RATE_LIMIT_AUTH_RECOVERY=${RATE_LIMIT_AUTH_RECOVERY:-10/hour}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - EMAIL_DELIVERY_ENABLED=${EMAIL_DELIVERY_ENABLED:-false}
      - AUTH_PUBLIC_BASE_URL=${AUTH_PUBLIC_BASE_URL:-https://tax-advisor.ge}
      - AUTH_EMAIL_VERIFICATION_HOURS=${AUTH_EMAIL_VERIFICATION_HOURS:-24}
      - AUTH_PASSWORD_RESET_MINUTES=${AUTH_PASSWORD_RESET_MINUTES:-30}
      - AUTH_EMAIL_RESEND_COOLDOWN_SECONDS=${AUTH_EMAIL_RESEND_COOLDOWN_SECONDS:-60}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - INFOHUB_RAG_V2_MODE=${INFOHUB_RAG_V2_MODE:-rollout}
      - INFOHUB_RAG_V2_SHADOW_SAMPLE_RATE=${INFOHUB_RAG_V2_SHADOW_SAMPLE_RATE:-1.0}
      - INFOHUB_RAG_V2_SHADOW_LOG_PATH=${INFOHUB_RAG_V2_SHADOW_LOG_PATH:-/tmp/rag_v2_shadow.jsonl}
      - INFOHUB_RAG_V2_ROLLOUT_CLASSES=${INFOHUB_RAG_V2_ROLLOUT_CLASSES:-named_document_lookup,canonical_law_lookup,local_regulation_lookup,amendment_tracking}
      - INFOHUB_RAG_V2_ROLLOUT_TOP_K=${INFOHUB_RAG_V2_ROLLOUT_TOP_K:-3}
      - INFOHUB_EMBEDDING_V2=${INFOHUB_EMBEDDING_V2:-0}
      - EMBEDDING_ALLOW_DOWNLOAD=${EMBEDDING_ALLOW_DOWNLOAD:-false}
      - INFOHUB_DISABLED_GUARDS=${INFOHUB_DISABLED_GUARDS:-}
      - INFOHUB_DISABLED_LEGAL_ANSWER_CONTRACTS=${INFOHUB_DISABLED_LEGAL_ANSWER_CONTRACTS:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ai_models:/root/.cache/huggingface
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: infohub-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infohub-frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://tax-advisor.ge/api
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: infohub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static-frontend:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  infohub_postgres_data:
    external: true
  infohub_redis_data:
    external: true
  ai_models:
