# SonarCloud automatic analysis settings.
#
# UI copy dictionaries repeat the same keys for en/ru/ka with different
# strings. Duplication detection ignores literal values, so each language
# block reads as a copy of the others. These files are excluded from
# duplication only; every other rule still applies to them.
sonar.cpd.exclusions=frontend/lib/i18n.tsx,frontend/lib/legal-content.ts,frontend/lib/billing-reconciliation.ts,frontend/lib/billing-review.ts
