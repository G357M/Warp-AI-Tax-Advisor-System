name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
      JWT_SECRET_KEY: test-jwt-secret-for-ci-minimum-32-characters
      OPENAI_API_KEY: test-key
      ENVIRONMENT: testing
      DEBUG: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile runtime modules
        run: python -m compileall -q api billing core models

      - name: Run current API contracts
        run: >-
          python -m pytest
          tests/test_security_hardening.py
          tests/test_plan_quotas.py
          tests/test_evidence_contract.py
          tests/test_integration.py
          -q -p no:cacheprovider

      - name: Audit production dependency resolution
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-production.txt --progress-spinner off

  frontend:
    name: Frontend lint, types, build and critical audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

      # Keep production dependencies free of high/critical advisories. The
      # Next 16/React 19 lifecycle migration remains a separate regression task.
      - run: npm audit --omit=dev --audit-level=high

  containers:
    name: Production image builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: infohub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: infohub-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
