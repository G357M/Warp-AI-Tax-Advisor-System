name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
      JWT_SECRET_KEY: test-jwt-secret-for-ci-minimum-32-characters
      OPENAI_API_KEY: test-key
      ENVIRONMENT: testing
      DEBUG: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile runtime modules
        run: >-
          python -m compileall -q
          api billing core legal_temporal models rag rag_v2 scraper
          decision_fact_contract.py
          scripts/admit_legal_temporal_review.py
          scripts/add_auth_recovery.py
          scripts/audit_production_readiness.py
          scripts/audit_legal_answer_contracts.py
          scripts/audit_legal_answer_coverage.py
          scripts/audit_legal_temporal_backfill.py
          scripts/audit_legal_temporal_schema.py
          scripts/build_legal_answer_contract_canary.py
          scripts/build_legal_temporal_backfill_bundle.py
          scripts/build_official_provision_registry.py
          scripts/build_decision_facts_full_review_bundle.py
          scripts/build_decision_facts_review_bundle.py
          scripts/evaluate_decision_facts_quality.py
          scripts/evaluate_public_provision_canary.py
          scripts/export_decision_facts_expert_review.py
          scripts/import_decision_facts_review_workbook.py
          scripts/import_legal_temporal_backfill.py
          scripts/install_legal_temporal_schema.py
          scripts/link_decision_chains.py
          scripts/prepare_duplicate_expert_prefill.py
          scripts/repair_decision_fact_normalization.py
          scripts/review_legal_temporal.py
          scripts/scrape_infohub_api.py
          scripts/validate_decision_facts_expert_review.py
          scripts/verify_infohub_duplicate_candidates.py
          ../scripts/audit_ingestion_freshness.py
          ../scripts/audit_production_storage.py
          ../scripts/manage_infohub_buildkit.py
          ../scripts/retire_infohub_legacy_buildkit.py

      - name: Run current API contracts
        run: >-
          python -m pytest
          tests/test_config_contract.py
          tests/test_embedding_model_loader.py
          tests/test_production_readiness_audit.py
          tests/test_production_storage_audit.py
          tests/test_buildkit_cache_policy.py
          tests/test_legacy_buildkit_retirement.py
          tests/test_time_contract.py
          tests/test_nightly_maintenance.py
          tests/test_nightly_quality_gates.py
          tests/test_rag_v2_live_corpus_eval.py
          tests/test_official_provisions.py
          tests/test_official_provision_registry_builder.py
          tests/test_named_legal_acts.py
          tests/test_infohub_api_scraper_stats.py
          tests/test_scrape_infohub_api_runner.py
          tests/test_ingestion_freshness_audit.py
          tests/test_source_audit_currentness.py
          tests/test_answer_safety_eval.py
          tests/test_public_provision_canary.py
          tests/test_decision_chain_reporting.py
          tests/test_decision_fact_contract.py
          tests/test_decision_fact_extractor.py
          tests/test_decision_fact_repair.py
          tests/test_decision_facts_quality_eval.py
          tests/test_decision_facts_full_review.py
          tests/test_decision_facts_review_workbook_import.py
          tests/test_decision_facts_review_bundle.py
          tests/test_database_restore_drill.py
          tests/test_frontend_font_delivery.py
          tests/test_security_hardening.py
          tests/test_plan_quotas.py
          tests/test_evidence_contract.py
          tests/test_integration.py
          tests/test_legal_answer_contracts.py
          tests/test_legal_answer_coverage.py
          tests/test_legal_temporal_backfill.py
          tests/test_legal_temporal_expert_review.py
          tests/test_legal_temporal_review_admission.py
          tests/test_legal_temporal_foundation.py
          tests/test_infohub_duplicate_verification.py
          tests/test_duplicate_expert_prefill.py
          -q -p no:cacheprovider
          -W error::DeprecationWarning

      - name: Run deterministic multilingual RAG quality gate
        working-directory: ${{ github.workspace }}
        run: |
          python evaluation/rag_v2_contract_gate.py
          python -m pytest \
            backend/rag_v2/test_rag_v2_pipeline.py \
            backend/rag_v2/test_rag_v2_public_response.py \
            -q -p no:cacheprovider \
            -W error::DeprecationWarning

      - name: Validate bounded answer-safety execution plan
        run: python scripts/evaluate_answer_safety_live.py

      - name: Validate bounded public provision canary plan
        run: python scripts/evaluate_public_provision_canary.py

      - name: Validate generated legal answer contracts
        run: |
          python scripts/audit_legal_answer_contracts.py
          python scripts/audit_legal_answer_coverage.py
          python scripts/build_legal_answer_contract_canary.py

      - name: Validate read-only decision-facts quality plan
        run: python scripts/evaluate_decision_facts_quality.py

      - name: Audit production dependency resolution
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-production.txt --progress-spinner off

  temporal-postgres:
    name: Temporal schema and immutable evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
      JWT_SECRET_KEY: test-jwt-secret-for-ci-minimum-32-characters
      OPENAI_API_KEY: test-key
      ENVIRONMENT: testing
      DEBUG: "false"
      RATE_LIMIT_ENABLED: "false"
      LEGAL_TEMPORAL_POSTGRES_TESTS: "1"
      LEGAL_TEMPORAL_SCHEMA_CONTRACT_SHA256: b69e7bcc73da12c5b80a69ec6fc436758842a11b838895d02241dcde0af07e98

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Create legacy document FK fixture
        run: >-
          python -c "from sqlalchemy import text;
          from core.database import engine;
          from models.document import Document, LawAmendment;
          connection=engine.connect();
          connection.execute(text('CREATE EXTENSION IF NOT EXISTS vector'));
          connection.commit();
          connection.close();
          Document.__table__.create(engine);
          LawAmendment.__table__.create(engine)"
      - name: Install pinned additive temporal schema
        run: >-
          python scripts/install_legal_temporal_schema.py
          --apply
          --expected-contract-sha256 "$LEGAL_TEMPORAL_SCHEMA_CONTRACT_SHA256"
      - name: Exercise PostgreSQL immutability and interval triggers
        run: >-
          python -m pytest
          tests/test_legal_temporal_postgres.py
          tests/test_legal_temporal_backfill_postgres.py
          tests/test_legal_temporal_review_admission_postgres.py
          -q -p no:cacheprovider
          -W error::DeprecationWarning
      - name: Audit temporal foundation after backfill integration
        run: >-
          python scripts/audit_legal_temporal_schema.py
          --execute
          --expected-contract-sha256 "$LEGAL_TEMPORAL_SCHEMA_CONTRACT_SHA256"

  frontend:
    name: Frontend lint, types, build and critical audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

      # Production dependencies must remain free of high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high

  visual:
    name: Deterministic visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Matches @playwright/test 1.62.1; digest prevents runner-image drift.
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test:visual

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Production image builds
    needs: [backend, temporal-postgres, frontend, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Validate operational shell scripts
        run: >-
          bash -n
          scripts/deploy_production.sh
          scripts/rotate_jwt_secret.sh
          scripts/finalize_jwt_rotation.sh
          scripts/rotate_database_password.sh
          scripts/prune_infohub_rollbacks.sh
          scripts/test_database_restore.sh
          scripts/configure_ingestion_schedule.sh
          backend/scripts/setup_cron.sh
          run_scraper.sh
          run_quality_gates.sh
          scraper_alert.sh
          canary_alert.sh
          quality_gate_alert.sh

      - name: Validate operational PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/backup_database.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: infohub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: infohub-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
