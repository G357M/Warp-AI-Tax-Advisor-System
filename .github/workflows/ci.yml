name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
      JWT_SECRET_KEY: test-jwt-secret-for-ci-minimum-32-characters
      OPENAI_API_KEY: test-key
      ENVIRONMENT: testing
      DEBUG: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile runtime modules
        run: python -m compileall -q api billing core models

      - name: Run current API contracts
        run: >-
          python -m pytest
          tests/test_config_contract.py
          tests/test_time_contract.py
          tests/test_nightly_maintenance.py
          tests/test_rag_v2_live_corpus_eval.py
          tests/test_answer_safety_eval.py
          tests/test_security_hardening.py
          tests/test_plan_quotas.py
          tests/test_evidence_contract.py
          tests/test_integration.py
          -q -p no:cacheprovider
          -W error::DeprecationWarning

      - name: Run deterministic multilingual RAG quality gate
        working-directory: ${{ github.workspace }}
        run: |
          python evaluation/rag_v2_contract_gate.py
          python -m pytest \
            backend/rag_v2/test_rag_v2_pipeline.py \
            backend/rag_v2/test_rag_v2_public_response.py \
            -q -p no:cacheprovider \
            -W error::DeprecationWarning

      - name: Validate bounded answer-safety execution plan
        run: python scripts/evaluate_answer_safety_live.py

      - name: Audit production dependency resolution
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-production.txt --progress-spinner off

  frontend:
    name: Frontend lint, types, build and critical audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

      # Production dependencies must remain free of high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high

  containers:
    name: Production image builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Validate operational shell scripts
        run: >-
          bash -n
          scripts/deploy_production.sh
          scripts/rotate_jwt_secret.sh
          scripts/finalize_jwt_rotation.sh
          scripts/rotate_database_password.sh
          scripts/prune_infohub_rollbacks.sh
          run_scraper.sh
          scraper_alert.sh
          canary_alert.sh

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: infohub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: infohub-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
