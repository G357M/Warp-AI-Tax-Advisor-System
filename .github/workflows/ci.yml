name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
      JWT_SECRET_KEY: test-jwt-secret-for-ci-minimum-32-characters
      OPENAI_API_KEY: test-key
      ENVIRONMENT: testing
      DEBUG: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile runtime modules
        run: >-
          python -m compileall -q
          api billing core models rag
          decision_fact_contract.py
          scripts/add_auth_recovery.py
          scripts/audit_production_readiness.py
          scripts/build_decision_facts_full_review_bundle.py
          scripts/build_decision_facts_review_bundle.py
          scripts/evaluate_decision_facts_quality.py
          scripts/export_decision_facts_expert_review.py
          scripts/import_decision_facts_review_workbook.py
          scripts/link_decision_chains.py
          scripts/repair_decision_fact_normalization.py
          scripts/validate_decision_facts_expert_review.py
          scripts/verify_infohub_duplicate_candidates.py
          ../scripts/manage_infohub_buildkit.py

      - name: Run current API contracts
        run: >-
          python -m pytest
          tests/test_config_contract.py
          tests/test_embedding_model_loader.py
          tests/test_production_readiness_audit.py
          tests/test_buildkit_cache_policy.py
          tests/test_time_contract.py
          tests/test_nightly_maintenance.py
          tests/test_nightly_quality_gates.py
          tests/test_rag_v2_live_corpus_eval.py
          tests/test_answer_safety_eval.py
          tests/test_decision_chain_reporting.py
          tests/test_decision_fact_contract.py
          tests/test_decision_fact_extractor.py
          tests/test_decision_fact_repair.py
          tests/test_decision_facts_quality_eval.py
          tests/test_decision_facts_full_review.py
          tests/test_decision_facts_review_workbook_import.py
          tests/test_decision_facts_review_bundle.py
          tests/test_database_restore_drill.py
          tests/test_frontend_font_delivery.py
          tests/test_security_hardening.py
          tests/test_plan_quotas.py
          tests/test_evidence_contract.py
          tests/test_integration.py
          tests/test_infohub_duplicate_verification.py
          -q -p no:cacheprovider
          -W error::DeprecationWarning

      - name: Run deterministic multilingual RAG quality gate
        working-directory: ${{ github.workspace }}
        run: |
          python evaluation/rag_v2_contract_gate.py
          python -m pytest \
            backend/rag_v2/test_rag_v2_pipeline.py \
            backend/rag_v2/test_rag_v2_public_response.py \
            -q -p no:cacheprovider \
            -W error::DeprecationWarning

      - name: Validate bounded answer-safety execution plan
        run: python scripts/evaluate_answer_safety_live.py

      - name: Validate read-only decision-facts quality plan
        run: python scripts/evaluate_decision_facts_quality.py

      - name: Audit production dependency resolution
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-production.txt --progress-spinner off

  frontend:
    name: Frontend lint, types, build and critical audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

      # Production dependencies must remain free of high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high

  visual:
    name: Deterministic visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Matches @playwright/test 1.62.1; digest prevents runner-image drift.
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test:visual

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Production image builds
    needs: [backend, frontend, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Validate operational shell scripts
        run: >-
          bash -n
          scripts/deploy_production.sh
          scripts/rotate_jwt_secret.sh
          scripts/finalize_jwt_rotation.sh
          scripts/rotate_database_password.sh
          scripts/prune_infohub_rollbacks.sh
          scripts/test_database_restore.sh
          run_scraper.sh
          run_quality_gates.sh
          scraper_alert.sh
          canary_alert.sh
          quality_gate_alert.sh

      - name: Validate operational PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/backup_database.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: infohub-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: infohub-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
