name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tax-advisor-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Hetzner fast-forward deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://tax-advisor.ge

    steps:
      - name: Configure pinned SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy checked main through server rollback guard
        run: >-
          ssh -o BatchMode=yes root@46.224.145.5
          'cd /root/infohub && ./scripts/deploy_production.sh'

      - name: Verify public health
        run: curl --fail --show-error --silent https://tax-advisor.ge/api/v1/public/health
